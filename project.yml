name: TravelDrawer
options:
  bundleIdPrefix: com.bbuji
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  TravelDrawer:
    type: application
    platform: iOS
    sources:
      - path: TravelDrawer
    info:
      path: TravelDrawer/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: 여행 서랍
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbuji.traveldrawer
        PRODUCT_NAME: 여행 서랍
